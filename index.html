<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alcide</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Alcide"><meta name="theme-color" content="#0c0d0f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{document.documentElement.setAttribute("data-skin",JSON.parse(localStorage.getItem("muscu_v3")||"{}").th||"alcide")}catch(e){document.documentElement.setAttribute("data-skin","alcide")}</script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14161a;--mu:#6b7280;--ac:#e8590c;--ok:#16a34a;--bd:#e3e5e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#181b20;--tx:#f1f2f4;--mu:#9097a3;--bd:#262a31}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#181b20;--tx:#f1f2f4;--mu:#9097a3;--bd:#262a31}
button,input,select,textarea{font-family:inherit}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Poppins",-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header{padding:12px 16px 8px}select{max-width:100%;min-width:0;text-overflow:ellipsis}.food,.ex{min-width:0}
.lg{display:flex;justify-content:center;padding-bottom:6px}.nom{display:inline-block;font-size:17px;font-weight:800;letter-spacing:.5px;margin:0 0 6px 2px;background:linear-gradient(135deg,#ffe08a,#b8820e);-webkit-background-clip:text;background-clip:text;color:transparent}.lg img{height:36px;width:36px;border-radius:9px}
#fin{display:none;padding:2px 0}#fin button{width:100%;height:60px;border:0;border-radius:16px;font:inherit;font-size:19px;font-weight:700;color:#1a1204;background:linear-gradient(135deg,#ffe08a,#b8820e);box-shadow:0 4px 14px rgba(184,130,14,.35)}#fin button.pop{animation:pop .35s}@keyframes pop{40%{transform:scale(.94)}100%{transform:scale(1)}}
.cs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.cs .btn.on{background:var(--ac);color:#fff;border:0}.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}#vid{width:100%;border-radius:12px;background:#000;margin-top:8px;max-height:260px}
h1{font-size:24px;margin:0 0 12px;font-weight:800;letter-spacing:-.02em}
.est{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.est b{font-size:26px;color:var(--ac)}
.est small{color:var(--mu);display:block;font-size:12px;margin-top:2px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px}
.btn.p{background:var(--ac);color:#fff;border:0}
.nav{display:flex;gap:8px;padding:6px 16px 10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.nav::-webkit-scrollbar{display:none}.nav.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
.nv{flex:0 0 calc((100% - 16px)/3);scroll-snap-align:start;padding:15px 6px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nv.on{background:linear-gradient(135deg,#f5772f,#e8590c);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(232,89,12,.35)}
.grp{display:grid;gap:8px;margin-bottom:8px}
.cat{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cat small{display:block;color:var(--mu);font-weight:500;font-size:13px;margin-top:2px}
.cat .chv{color:var(--mu);font-size:24px}
.list{padding:4px 16px;display:grid;gap:10px}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.ex.in{border-color:var(--ac)}
.ex.cur{border-color:var(--ac)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:600;font-size:16px}
.nt{color:var(--mu);font-size:13px;margin-top:2px}
.dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:transparent;color:var(--mu);font-size:16px;font-weight:600}
.dot.d{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.n{border-color:var(--ac);color:var(--ac)}
.sm{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
.sh{margin:14px 0 4px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.in{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.hd{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;color:var(--mu);font-size:20px;font-weight:800;letter-spacing:-3px;padding:6px 10px 6px 2px;align-self:center;line-height:1}
.ex.drag{opacity:.85;border-color:var(--ac);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.pg{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.fm{display:flex;flex-direction:column;gap:10px}.fm label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:4px;min-width:0}.fm .in,.pg .in{width:100%;min-width:0;box-sizing:border-box}details.cfd summary::-webkit-details-marker{display:none}.pg label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.food{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac)}
.fr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.fr:last-child{border-bottom:0}
.big{font-size:28px;font-weight:700;color:var(--ac)}
.chrono{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px}
.time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;min-width:140px}
.go{flex:1;height:64px;border-radius:16px;border:0;font-size:20px;font-weight:700;color:#fff;background:var(--ok)}
.go.run{background:#dc2626}
.last{font-size:12px;color:var(--mu)}

.ico,.ring,.rk{display:none}
:root[data-skin="alcide"]{--bg:#0d0c09;--card:#171510;--tx:#f6f0e4;--mu:#a1977f;--ac:#d6a72c;--ok:#d6a72c;--bd:#2b2619;--gold:linear-gradient(135deg,#ffe08a,#b8820e)}
[data-skin="alcide"] body{background:radial-gradient(120% 60% at 50% 0%,#1d1809 0%,#0d0c09 55%) fixed,#0d0c09}
[data-skin="alcide"] .btn.p,[data-skin="alcide"] .cs .btn.on{background:var(--gold);color:#1a1204;font-weight:700;border:0}
[data-skin="alcide"] .nv{border-radius:16px;background:var(--card)}
[data-skin="alcide"] .nv.on{background:var(--gold);color:#1a1204;box-shadow:0 4px 16px rgba(184,130,14,.4)}
[data-skin="alcide"] .est{border-color:#3a3119;box-shadow:0 2px 14px rgba(0,0,0,.4)}
[data-skin="alcide"] .est b,[data-skin="alcide"] .big{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-skin="alcide"] .sh{color:#b8975a;letter-spacing:.09em}
[data-skin="alcide"] .list{gap:14px}
[data-skin="alcide"] .ex,[data-skin="alcide"] .food{padding:16px;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
[data-skin="alcide"] .ex.in,[data-skin="alcide"] .ex.cur{border-color:#8a6a1c}
[data-skin="alcide"] .dots{gap:10px;margin-top:14px}
[data-skin="alcide"] .dot{width:48px;height:48px}
[data-skin="alcide"] .dot.d{background:var(--gold);border-color:transparent;color:#1a1204}
[data-skin="alcide"] .dot.n{border-color:var(--ac);color:var(--ac)}
[data-skin="alcide"] .dot.pop{animation:dpop .4s ease-out}
@keyframes dpop{0%{transform:scale(.8)}50%{transform:scale(1.3);box-shadow:0 0 0 8px rgba(214,167,44,.25)}100%{transform:scale(1)}}
[data-skin="alcide"] .cat{padding:20px 18px;border-radius:18px;gap:14px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
[data-skin="alcide"] .cat>div{flex:1}
[data-skin="alcide"] .cat .chv{color:var(--ac)}
[data-skin="alcide"] .grp{gap:12px}
[data-skin="alcide"] .ico{display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:14px;border:1px solid #6b5316;background:rgba(214,167,44,.08);flex:none}
[data-skin="alcide"] .ico svg .f{fill:#e8c25a;stroke:none}
[data-skin="alcide"] .ico svg{width:38px;height:38px;fill:none;stroke:#e8c25a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[data-skin="alcide"] .bar{height:10px;background:#2b2619}
[data-skin="alcide"] .bar i{background:var(--gold);border-radius:6px;box-shadow:0 0 8px rgba(214,167,44,.45)}
[data-skin="alcide"] .big.gold{font-size:40px;line-height:1.15}
[data-skin="alcide"] .big.gold span{-webkit-text-fill-color:var(--mu)}
[data-skin="alcide"] .rk{display:block;font-size:34px;font-weight:700;line-height:1.1;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
[data-skin="alcide"] .rk small{font-size:15px;-webkit-text-fill-color:var(--mu)}
[data-skin="alcide"] .rmain{display:none}
[data-skin="alcide"] .chrono{background:rgba(23,21,16,.7);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid rgba(214,167,44,.3)}
[data-skin="alcide"] .go{background:var(--gold);color:#1a1204}
[data-skin="alcide"] .go.run{background:#dc2626;color:#fff}
[data-skin="alcide"] .time{font-size:40px;min-width:110px}
[data-skin="alcide"] .ring{display:block;width:50px;height:50px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}.ring .rb{stroke:#2b2619}.ring .rf{stroke:#e8c25a;stroke-linecap:round;stroke-dasharray:119.4;stroke-dashoffset:119.4;transition:stroke-dashoffset .25s linear}
[data-skin="alcide"] #list.fx{animation:fxin .3s ease-out}
@keyframes fxin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
[data-skin="alcide"] .cat,[data-skin="alcide"] .btn,[data-skin="alcide"] .nv,[data-skin="alcide"] .dot,[data-skin="alcide"] .go{transition:transform .15s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease}
[data-skin="alcide"] .cat:active,[data-skin="alcide"] .btn:active,[data-skin="alcide"] .nv:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){[data-skin="alcide"] #list.fx{animation:none}}
.skbtn{display:flex;gap:10px;margin-top:10px}.skbtn .btn{flex:1;padding:14px}.skbtn .btn.on{border-color:var(--ac);color:var(--ac)}
</style></head><body>

let run=false,t0=0,iv;

else{run=false;clearInterval(iv);const el=Date.now()-t0;show(0);$("cb").textContent="▶ Lancer";$("cb").className="go";
const s=Math.floor(el/1000);$("cl").textContent="Dernier : "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}};

/* REORDER */
(()=>{let el=null;
document.addEventListener("pointerdown",e=>{const h=e.target.closest&&e.target.closest(".hd");if(!h)return;el=h.closest(".ex");el.classList.add("drag");try{h.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
document.addEventListener("pointermove",e=>{if(!el)return;
const y=e.clientY;if(y<90)window.scrollBy(0,-12);else if(y>innerHeight-90)window.scrollBy(0,12);
const all=[...document.querySelectorAll(".ex.in[data-ex]")];
for(const c of all){if(c===el)continue;const r=c.getBoundingClientRect();
if(y>=r.top&&y<=r.bottom){const after=el.compareDocumentPosition(c)&Node.DOCUMENT_POSITION_FOLLOWING;
if(after)c.after(el);else c.before(el);break}}});
const end=()=>{if(!el)return;el.classList.remove("drag");el=null;
const ks=[...document.querySelectorAll(".ex.in[data-ex]")].map(c=>c.dataset.ex),N={};
ks.forEach(k=>{if(S.sel[k])N[k]=S.sel[k]});Object.keys(S.sel).forEach(k=>{if(!N[k])N[k]=S.sel[k]});
S.sel=N;save();render()};
document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end)})();
