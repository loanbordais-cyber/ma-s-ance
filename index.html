<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Séance</title>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#181b20;--tx:#f1f2f4;--mu:#9097a3;--bd:#262a31}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#181b20;--tx:#f1f2f4;--mu:#9097a3;--bd:#262a31}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 8px}
h1{font-size:24px;margin:0 0 12px;font-weight:800;letter-spacing:-.02em}
.est{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.est b{font-size:26px;color:var(--ac)}
.est small{color:var(--mu);display:block;font-size:12px;margin-top:2px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px}
.btn.p{background:var(--ac);color:#fff;border:0}
.nav{display:flex;gap:8px;padding:6px 16px 10px}
.nv{flex:1;padding:15px 6px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nv.on{background:linear-gradient(135deg,#f5772f,#e8590c);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(232,89,12,.35)}
.grp{display:grid;gap:8px;margin-bottom:8px}
.cat{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cat small{display:block;color:var(--mu);font-weight:400;font-size:13px;margin-top:2px}
.cat .chv{color:var(--mu);font-size:24px}
.list{padding:4px 16px;display:grid;gap:10px}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.ex.in{border-color:var(--ac)}
.ex.cur{border-color:var(--ac)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:600;font-size:16px}
.nt{color:var(--mu);font-size:13px;margin-top:2px}
.dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:transparent;color:var(--mu);font-size:16px;font-weight:600}
.dot.d{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.n{border-color:var(--ac);color:var(--ac)}
.sm{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
.sh{margin:14px 0 4px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.in{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pg label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.food{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac)}
.fr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.fr:last-child{border-bottom:0}
.big{font-size:28px;font-weight:700;color:var(--ac)}
.chrono{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px}
.time{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;min-width:140px}
.go{flex:1;height:64px;border-radius:16px;border:0;font-size:20px;font-weight:700;color:#fff;background:var(--ok)}
.go.run{background:#dc2626}
.last{font-size:12px;color:var(--mu)}
</style></head><body>

const defFoods=()=>FOODS.map(f=>({n:f[0],c:f[1],p:f[2],k:f[3],g:f[4]}));
if(!S.foods)S.foods=defFoods().concat((S.customFoods||[]).map(f=>({n:f.n,c:"Perso",p:f.p,k:f.k||0,g:f.g})));
else if(!S.fv){const od=S.foods,dn=defFoods(),by={};od.forEach(f=>by[f.n]=f);
const mg=dn.map(d=>{const o=by[d.n];return o?{n:o.n,c:d.c,p:o.p,k:o.k>0?o.k:d.k,g:o.g}:d});
const ds=new Set(dn.map(d=>d.n));od.forEach(f=>{if(!ds.has(f.n))mg.push({n:f.n,c:f.c||"Perso",p:f.p,k:f.k||0,g:f.g})});S.foods=mg}

if(!["ex","nut","set"].includes(S.view))S.view="ex";

const ES=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

const r10=x=>Math.round(x/10)*10;
function dur(sec){const m=Math.round(sec/60);return m>=60?Math.floor(m/60)+"h"+String(m%60).padStart(2,"0"):m+" min"}
function burn(sec){const w=+S.prof.w;return w?r10(5*w*sec/3600):0}
const keyD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey=()=>keyD(new Date());
function dayOff(o){const d=new Date();d.setDate(d.getDate()+o);return keyD(d)}
const curKey=()=>S.nd||todayKey();
function dayLabel(k){if(k==todayKey())return"Aujourd'hui";if(k==dayOff(-1))return"Hier";return new Date(k+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function protTarget(){const w=+S.prof.w;return w?Math.round(1.8*w):null}
function calGoal(){const P=S.prof,w=+P.w,h=+P.h,a=+P.a||20,n=+P.n||4;if(!w||!h)return null;
const bmr=10*w+6.25*h-5*a+(P.s=="f"?-161:5);const tdee=bmr*Math.min(1.4+0.05*n,1.75);return{bmr,tdee,goal:tdee*1.10,lo:tdee*1.05,hi:tdee*1.15}}
function lastDur(){const L=S.hist.filter(x=>x.type=="muscu").sort((a,b)=>b.s-a.s).slice(0,3);return L.length?{n:L.length,avg:L.reduce((a,x)=>a+x.dur,0)/L.length}:null}
function monday(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function isoWk(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}

function sesBlock(){const k=Object.keys(S.sel);if(!k.length)return"";
return`<div class="sh">Dans ma séance (${k.length})</div>`+k.map(x=>card(S.sel[x].n,S.sel[x].note,true,false)).join("")+`<div style="padding:10px 0"><button class="btn p" id="sv">💾 Enregistrer comme séance</button></div>`}

if(S.cat=="Cardio")return h+cardioView();
const cus=(S.custom[S.cat]||[]).map(n=>[n,"Perso",1]);
h+=DATA[S.cat].concat(cus).filter(e=>!S.sel[id(e[0])]).map(e=>card(e[0],e[1],false,!!e[2])).join("");
return h+`<div class="ex"><div class="nm">Créer mon exo (${S.cat})</div><div class="dots"><input class="in" id="ni" placeholder="Nom de l'exercice"><button class="btn p" id="nb">Créer</button></div></div>`}
function card(n,note,on,cu){
const k=id(n),s=S.sel[k];let d="";
if(on){d=`<div class="dots">`;for(let i=0;i<s.sets;i++)d+=`<button class="dot ${i<s.done?"d":i==s.done?"n":""}" data-k="${k}" data-i="${i}">${i<s.done?"✓":i+1}</button>`;
d+=`<button class="sm" data-k="${k}" data-a="-">−</button><button class="sm" data-k="${k}" data-a="+">+</button></div>`}
return`<div class="ex ${on?"in":""}"><div class="top"><div><div class="nm">${ES(n)}</div><div class="nt">${ES(note)}</div></div><div style="display:flex;gap:6px"><button class="btn ${on?"":"p"}" data-k="${k}" data-n="${ES(n)}" data-note="${ES(note)}" data-add="${on?0:1}">${on?"Retirer":"+ Ajouter"}</button>${cu&&!on?`<button class="sm" data-delex="${ES(n)}">🗑</button>`:""}</div></div>${d}</div>`}

/* CARDIO */
const pace=(km,sec)=>{const p=sec/km;return Math.floor(p/60)+"'"+String(Math.round(p%60)).padStart(2,"0")+'"/km'};
function cardioView(){
const L=S.hist.filter(x=>x.type=="cardio").sort((a,b)=>a.s-b.s);
let h=`<div class="ex"><div class="nm">Nouvelle sortie</div><div class="pg" style="margin-top:8px"><label>Distance (km)<input class="in" id="ckm" type="number" inputmode="decimal" step="0.01"></label><label>Durée (min / s)<div style="display:flex;gap:6px"><input class="in" id="cmn" type="number" inputmode="numeric" placeholder="min"><input class="in" id="csc" type="number" inputmode="numeric" placeholder="s"></div></label></div><div class="dots"><button class="btn p" id="cadd">Enregistrer la sortie</button></div><div class="nt" style="margin-top:6px">La vitesse et l'allure sont calculées automatiquement.</div></div>`;
if(!L.length)return h+`<div class="nt">Aucune sortie pour l'instant.</div>`;
h+=`<div class="sh">Mes sorties</div>`;
return h+L.map((x,i)=>{const v=x.km/(x.dur/3600),pv=i?L[i-1].km/(L[i-1].dur/3600):0;const dl=pv?Math.round((v-pv)/pv*1000)/10:null;
return{o:x.s,t:`<div class="food"><div class="fr"><div><div class="nm">${fd(x.e)} · ${x.km} km en ${dur(x.dur)}</div><div class="nt">${(Math.round(v*10)/10)} km/h · ${pace(x.km,x.dur)}${dl!=null?` · ${dl>=0?"▲ +":"▼ "}${dl} % vs sortie précédente`:""}</div></div><button class="sm" data-delh="${x.id}">🗑</button></div></div>`}}).reverse().map(x=>x.t).join("")}

/* PARAMETRES */
function setView(){

function prog(L){
const la=L[L.length-1],ms=S.hist.filter(x=>x.type=="muscu").sort((a,b)=>b.s-a.s);let ref=null,lab="";
if(ms.length>=5){L.forEach(e=>{if(e.ts<=ms[4].s)ref=e});if(ref)lab="il y a 5 séances"}
if(!ref&&L.length>1){ref=L[0];lab="depuis la première valeur"}
if(!ref)return"Première valeur enregistrée, la progression apparaîtra à la prochaine mise à jour.";
const p=Math.round((la.kg-ref.kg)/ref.kg*1000)/10;
return`<b style="color:${p>=0?"var(--ok)":"#dc2626"}">${p>=0?"+":""}${p} %</b> ${lab} (${ref.kg} → ${la.kg} kg)`}

async function readBarcode(file){

function kcalOf(nt){
const g=k=>{const v=parseFloat(nt[k]);return isNaN(v)?0:v};
let k=g("energy-kcal_100g"),est=false;
if(!(k>0)){const kj=g("energy-kj_100g")||g("energy_100g")||g("energy-kj")||g("energy");if(kj>0)k=kj/4.184}
if(!(k>0)){const m=g("proteins_100g")*4+g("carbohydrates_100g")*4+g("fat_100g")*9;if(m>0){k=m;est=true}}
return k>0?{k:Math.round(k),est}:null}

if(!(pp>=0)||!(kk>=0)||!(g>0)){st("Complète les protéines, les calories et la quantité.");return}

pushJ(curKey(),{n,g,p:pp*g/100,k:kk*g/100});SC=null;SCST=""}

$("rst").onclick=()=>{
if(!S.start&&Object.keys(S.sel).length){S.start=Date.now();S.last=null;save();render();return}
if(confirm("Remettre toutes les séries à zéro ?")){Object.values(S.sel).forEach(s=>s.done=0);S.start=null;S.last=null;save();render()}};
$("pc").onclick=()=>{const v=prompt("Temps moyen par série, repos compris (en secondes) :",S.pace||150);const n=parseInt(v);if(n>=30&&n<=600){S.pace=n;save();eta()}};
document.addEventListener("change",async e=>{
const f=e.target.files&&e.target.files[0];if(!f)return;
if(e.target.id=="bcf"){st("Lecture du code-barres…");try{await lookup(await readBarcode(f))}catch(err){st("Code-barres illisible. Rapproche-toi, fais une photo nette, ou tape le numéro.")}}});

function eta(){
let tot=0,done=0,ne=0;Object.values(S.sel).forEach(s=>{tot+=s.sets;done+=s.done;ne++});
$("rst").textContent=(!S.start&&tot)?"▶ Démarrer":"Nouvelle séance";
if(!tot){$("eta").textContent="--:--";$("etaTxt").textContent="Ajoute des exos pour estimer ta fin de séance";return}
const rem=tot-done;
if(!rem){$("eta").textContent="Terminé 🎉";$("etaTxt").textContent=done+" séries faites · séance enregistrée";return}
const dp=S.pace||150;let pace=dp;
if(done>0&&S.start&&S.last){const m=(S.last-S.start)/1000/done;const w=Math.min(done/4,1);pace=Math.max(45,Math.min(400,m*w+dp*(1-w)))}
const end=new Date(Date.now()+rem*pace*1000);
$("eta").textContent="~ "+fmt(end);
$("etaTxt").textContent=tot+" séries prévues ("+ne+" exos) · "+rem+" restantes · ~"+Math.round(pace)+" s/série · durée totale ~"+dur(tot*pace)+(+S.prof.w?" · ~"+burn(tot*pace)+" kcal":"")+(S.start?"":" · appuie sur Démarrer")}
let run=false,t0=0,iv;
function show(ms){const s=Math.floor(ms/1000);$("ct").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
$("cb").onclick=()=>{
if(!run){run=true;t0=Date.now();$("cb").textContent="⏸ Stop";$("cb").className="go run";$("cl").textContent="En cours…";iv=setInterval(()=>show(Date.now()-t0),200)}
else{run=false;clearInterval(iv);const el=Date.now()-t0;show(0);$("cb").textContent="▶ Lancer";$("cb").className="go";
const s=Math.floor(el/1000);$("cl").textContent="Dernier : "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}};
render();setInterval(eta,30000);
</script></body></html>
